name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify effective Supabase URL
        shell: bash
        run: |
          set -euo pipefail
          build_config="$(find app/build/generated -type f -path '*debug*' -name 'BuildConfig.java' -print -quit)"
          if [[ -z "$build_config" ]]; then
            echo "Supabase URL verification failed: generated BuildConfig.java not found."
            exit 1
          fi
          expected='https://ejpcgcaoqyqjionvtsdi.supabase.co'
          actual="$(sed -n 's/.*SUPABASE_URL = "\(.*\)";.*/\1/p' "$build_config")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Supabase URL verification failed: effective BuildConfig.SUPABASE_URL does not exactly match the expected URL."
            exit 1
          fi
          echo "Supabase URL verification passed: BuildConfig.SUPABASE_URL matches the expected URL exactly."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: work-social-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
