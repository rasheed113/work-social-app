name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY }}
  WORK_SOCIAL_KEYSTORE_BASE64: ${{ secrets.WORK_SOCIAL_KEYSTORE_BASE64 }}
  WORK_SOCIAL_KEYSTORE_PASSWORD: ${{ secrets.WORK_SOCIAL_KEYSTORE_PASSWORD }}
  WORK_SOCIAL_KEY_ALIAS: ${{ secrets.WORK_SOCIAL_KEY_ALIAS }}
  WORK_SOCIAL_KEY_PASSWORD: ${{ secrets.WORK_SOCIAL_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Supabase configuration sources
        shell: bash
        run: |
          set -euo pipefail
          for name in WORK_SOCIAL_SUPABASE_URL ORG_GRADLE_PROJECT_supabaseUrl; do
            if [[ -v "$name" && -n "${!name}" ]]; then echo "$name=present"; else echo "$name=absent"; fi
          done
          if [[ -v WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY && -n "$WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY" ]]; then echo "WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY=present"; else echo "WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY=absent (Gradle public fallback will be used)"; fi
          if [[ -f "$HOME/.gradle/gradle.properties" ]] && grep -Eq '^supabaseUrl[[:space:]]*=' "$HOME/.gradle/gradle.properties"; then echo "user-gradle-properties:supabaseUrl=present"; else echo "user-gradle-properties:supabaseUrl=absent"; fi
          if [[ -f "$HOME/.gradle/gradle.properties" ]] && grep -Eq '^supabasePublishableKey[[:space:]]*=' "$HOME/.gradle/gradle.properties"; then echo "user-gradle-properties:supabasePublishableKey=present"; else echo "user-gradle-properties:supabasePublishableKey=absent"; fi
          if [[ -f "local.properties" ]]; then
            if grep -Eq '(^|[[:space:]])supabaseUrl[[:space:]]*=' local.properties; then echo "local.properties:supabaseUrl=present"; else echo "local.properties:supabaseUrl=absent"; fi
            if grep -Eq '(^|[[:space:]])supabasePublishableKey[[:space:]]*=' local.properties; then echo "local.properties:supabasePublishableKey=present"; else echo "local.properties:supabasePublishableKey=absent"; fi
          else
            echo "local.properties:file=absent"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Regression test rejected Supabase URL override
        shell: bash
        run: |
          set -euo pipefail
          malformed='https://ejpcgcaoqyqjionvtsdi.supabase.co))'
          if WORK_SOCIAL_SUPABASE_URL="$malformed" gradle --no-daemon :app:tasks >/tmp/supabase-guard.log 2>&1; then
            echo "Regression test failed: malformed Supabase URL override was accepted."
            cat /tmp/supabase-guard.log
            exit 1
          fi
          if ! grep -Fq 'Invalid Work Social Supabase URL override' /tmp/supabase-guard.log; then
            echo "Regression test failed: build failed, but not because the Supabase URL guard rejected the override."
            cat /tmp/supabase-guard.log
            exit 1
          fi
          echo "Regression test passed: malformed Supabase URL override is rejected before APK generation."

      # Development validation intentionally runs before the release-signing gate.
      - name: Run unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build debug APK for development validation
        run: gradle --no-daemon assembleDebug

      - name: Verify debug package and version
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          test -n "$aapt2"
          badging="$($aapt2 dump badging "$apk")"
          grep -Fq "package: name='com.rasheed113.worksocial'" <<<"$badging"
          grep -Fq "versionCode='2'" <<<"$badging"
          grep -Fq "versionName='1.1.0'" <<<"$badging"
          echo "Development APK verification passed: package com.rasheed113.worksocial; versionCode 2; versionName 1.1.0."

      - name: Prepare update-compatible signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in WORK_SOCIAL_KEYSTORE_BASE64 WORK_SOCIAL_KEYSTORE_PASSWORD WORK_SOCIAL_KEY_ALIAS WORK_SOCIAL_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              echo "The existing installed app is signed with certificate 7ca89034adfc722ed4389f0d9a3d3147f5108cafc767634e5a56fa6e59fe3e32. CI must use the corresponding private key; a newly generated debug key is not update-compatible."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/work-social-update.keystore"
          printf '%s' "$WORK_SOCIAL_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "WORK_SOCIAL_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "Update-compatible signing key material prepared without printing credentials."

      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify effective Supabase BuildConfig and APK identity
        shell: bash
        run: |
          set -euo pipefail
          build_config="$(find app/build/generated -type f -path '*release*' -name 'BuildConfig.java' -print -quit)"
          test -n "$build_config"
          expected='https://ejpcgcaoqyqjionvtsdi.supabase.co'
          actual_url="$(sed -n 's/.*SUPABASE_URL = "\(.*\)";.*/\1/p' "$build_config")"
          [[ "$actual_url" == "$expected" ]]
          grep -Eq 'SUPABASE_PUBLISHABLE_KEY = "[^"]+";' "$build_config"
          ! grep -Fq 'SUPABASE_PUBLISHABLE_KEY = "or(provider(?), fixed())";' "$build_config"

          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          badging="$($aapt2 dump badging "$apk")"
          grep -Fq "package: name='com.rasheed113.worksocial'" <<<"$badging"
          grep -Fq "versionCode='2'" <<<"$badging"
          grep -Fq "versionName='1.1.0'" <<<"$badging"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          cert_sha256="$($apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]')"
          expected_cert='7ca89034adfc722ed4389f0d9a3d3147f5108cafc767634e5a56fa6e59fe3e32'
          [[ "$cert_sha256" == "$expected_cert" ]]
          echo "Release identity verification passed."

          url_found=0
          malformed_found=0
          provider_string_found=0
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$'); do
            if unzip -p "$apk" "$dex" | strings | grep -Fq "$expected"; then url_found=1; fi
            if unzip -p "$apk" "$dex" | strings | grep -Fq 'ejpcgcaoqyqjionvtsdi.supabase.co))'; then malformed_found=1; fi
            if unzip -p "$apk" "$dex" | strings | grep -Fq 'or(provider(?), fixed())'; then provider_string_found=1; fi
          done
          [[ "$url_found" -eq 1 ]]
          [[ "$malformed_found" -eq 0 ]]
          [[ "$provider_string_found" -eq 0 ]]
          echo "APK verification passed: exact URL present; malformed URL and unresolved Provider string absent."

      - name: Upload update-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: work-social-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
