name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Supabase configuration sources
        shell: bash
        run: |
          set -euo pipefail
          for name in WORK_SOCIAL_SUPABASE_URL ORG_GRADLE_PROJECT_supabaseUrl; do
            if [[ -v "$name" && -n "${!name}" ]]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
          if [[ -v WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY && -n "$WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY=present"
          else
            echo "WORK_SOCIAL_SUPABASE_PUBLISHABLE_KEY=absent (Gradle public fallback will be used)"
          fi
          if [[ -f "$HOME/.gradle/gradle.properties" ]] && grep -Eq '^supabaseUrl[[:space:]]*=' "$HOME/.gradle/gradle.properties"; then
            echo "user-gradle-properties:supabaseUrl=present"
          else
            echo "user-gradle-properties:supabaseUrl=absent"
          fi
          if [[ -f "$HOME/.gradle/gradle.properties" ]] && grep -Eq '^supabasePublishableKey[[:space:]]*=' "$HOME/.gradle/gradle.properties"; then
            echo "user-gradle-properties:supabasePublishableKey=present"
          else
            echo "user-gradle-properties:supabasePublishableKey=absent"
          fi
          if [[ -f "local.properties" ]]; then
            if grep -Eq '(^|[[:space:]])supabaseUrl[[:space:]]*=' local.properties; then
              echo "local.properties:supabaseUrl=present"
            else
              echo "local.properties:supabaseUrl=absent"
            fi
            if grep -Eq '(^|[[:space:]])supabasePublishableKey[[:space:]]*=' local.properties; then
              echo "local.properties:supabasePublishableKey=present"
            else
              echo "local.properties:supabasePublishableKey=absent"
            fi
          else
            echo "local.properties:file=absent"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Regression test rejected Supabase URL override
        shell: bash
        run: |
          set -euo pipefail
          malformed='https://ejpcgcaoqyqjionvtsdi.supabase.co))'
          if WORK_SOCIAL_SUPABASE_URL="$malformed" gradle --no-daemon :app:tasks >/tmp/supabase-guard.log 2>&1; then
            echo "Regression test failed: malformed Supabase URL override was accepted."
            cat /tmp/supabase-guard.log
            exit 1
          fi
          if ! grep -Fq 'Invalid Work Social Supabase URL override' /tmp/supabase-guard.log; then
            echo "Regression test failed: build failed, but not because the Supabase URL guard rejected the override."
            cat /tmp/supabase-guard.log
            exit 1
          fi
          echo "Regression test passed: malformed Supabase URL override is rejected before APK generation."

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify effective Supabase BuildConfig and APK
        shell: bash
        run: |
          set -euo pipefail
          build_config="$(find app/build/generated -type f -path '*debug*' -name 'BuildConfig.java' -print -quit)"
          if [[ -z "$build_config" ]]; then
            echo "Supabase verification failed: generated BuildConfig.java not found."
            exit 1
          fi

          expected='https://ejpcgcaoqyqjionvtsdi.supabase.co'
          actual_url="$(sed -n 's/.*SUPABASE_URL = "\(.*\)";.*/\1/p' "$build_config")"
          if [[ "$actual_url" != "$expected" ]]; then
            echo "Supabase URL verification failed: BuildConfig.SUPABASE_URL is not the exact expected URL."
            exit 1
          fi

          if ! grep -Eq 'SUPABASE_PUBLISHABLE_KEY = "[^"]+";' "$build_config"; then
            echo "Supabase API-key verification failed: BuildConfig.SUPABASE_PUBLISHABLE_KEY is empty."
            exit 1
          fi
          if grep -Fq 'SUPABASE_PUBLISHABLE_KEY = "or(provider(?), fixed())";' "$build_config"; then
            echo "Supabase API-key verification failed: Gradle Provider.toString() leaked into BuildConfig."
            exit 1
          fi
          echo "BuildConfig verification passed: URL exact; publishable key present and evaluated."

          apk='app/build/outputs/apk/debug/app-debug.apk'
          if [[ ! -f "$apk" ]]; then
            echo "APK verification failed: $apk not found."
            exit 1
          fi

          url_found=0
          malformed_found=0
          provider_string_found=0
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$'); do
            if unzip -p "$apk" "$dex" | strings | grep -Fq "$expected"; then
              url_found=1
            fi
            if unzip -p "$apk" "$dex" | strings | grep -Fq 'ejpcgcaoqyqjionvtsdi.supabase.co))'; then
              malformed_found=1
            fi
            if unzip -p "$apk" "$dex" | strings | grep -Fq 'or(provider(?), fixed())'; then
              provider_string_found=1
            fi
          done

          if [[ "$url_found" -ne 1 ]]; then
            echo "APK verification failed: expected Supabase URL was not found in DEX strings."
            exit 1
          fi
          if [[ "$malformed_found" -ne 0 ]]; then
            echo "APK verification failed: malformed Supabase URL is present in the APK."
            exit 1
          fi
          if [[ "$provider_string_found" -ne 0 ]]; then
            echo "APK verification failed: unresolved Gradle Provider string is present in the APK."
            exit 1
          fi
          echo "APK verification passed: exact URL present; malformed URL and unresolved Provider string absent."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: work-social-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
