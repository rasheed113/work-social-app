name: Flutter Phase 1-2

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: analyze.log
          if-no-files-found: ignore
      - run: flutter test
