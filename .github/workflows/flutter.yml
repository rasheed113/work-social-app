name: Flutter Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Complete Flutter Android host
        working-directory: mobile_flutter
        run: |
          flutter create --platforms=android --org com.rasheed113 --project-name work_social_app .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('com.example.work_social_app','com.rasheed113.worksocial')
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('com.example.work_social_app','com.rasheed113.worksocial')
          p.write_text(s)
          PY
      - name: Flutter pub get
        working-directory: mobile_flutter
        run: flutter pub get
      - name: Flutter analyze
        working-directory: mobile_flutter
        run: flutter analyze
      - name: Flutter test
        working-directory: mobile_flutter
        run: flutter test
      - name: Flutter build APK
        working-directory: mobile_flutter
        run: flutter build apk --debug
