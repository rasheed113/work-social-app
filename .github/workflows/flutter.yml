name: Flutter Android CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate missing Flutter Android host files
        run: flutter create --platforms=android --org com.rasheed113 --project-name work_social_app .
      - name: Preserve application id
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts'), Path('android/app/src/main/AndroidManifest.xml')]:
              if f.exists():
                  s=f.read_text().replace('com.example.work_social_app','com.rasheed113.worksocial')
                  f.write_text(s)
          PY
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Flutter build APK
        run: flutter build apk --debug
